<svg viewBox="0 0 1900 1320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="1320" fill="#ffffff"/>
  <text x="30" y="35" font-size="22" font-weight="bold" fill="#202124">cloudock — Architecture</text>

  <!-- ===================== ZONE 1: CI/CD PIPELINE ===================== -->
  <rect x="20" y="70" width="1860" height="150" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="92" font-size="14" font-weight="bold" fill="#5f6368">CI/CD Pipeline — GitHub Actions</text>

  <rect x="40" y="105" width="140" height="65" rx="8" fill="#24292f"/>
  <text x="110" y="132" font-size="12" fill="#fff" text-anchor="middle">GitHub</text>
  <text x="110" y="148" font-size="12" fill="#fff" text-anchor="middle">repo</text>

  <rect x="220" y="105" width="190" height="65" rx="8" fill="#4285f4"/>
  <text x="315" y="126" font-size="11" fill="#fff" text-anchor="middle">Workload Identity</text>
  <text x="315" y="141" font-size="11" fill="#fff" text-anchor="middle">Federation</text>
  <text x="315" y="156" font-size="9" fill="#e8f0fe" text-anchor="middle">github-pool / github-provider</text>

  <rect x="450" y="105" width="150" height="65" rx="8" fill="#5f6368"/>
  <text x="525" y="132" font-size="11" fill="#fff" text-anchor="middle">cloud-run-sa</text>
  <text x="525" y="148" font-size="9" fill="#dadce0" text-anchor="middle">(impersonated)</text>

  <rect x="640" y="105" width="150" height="65" rx="8" fill="#673ab7"/>
  <text x="715" y="132" font-size="11" fill="#fff" text-anchor="middle">Checkov</text>
  <text x="715" y="148" font-size="9" fill="#ede7f6" text-anchor="middle">scans terraform/</text>

  <rect x="830" y="105" width="150" height="65" rx="8" fill="#0277bd"/>
  <text x="905" y="132" font-size="11" fill="#fff" text-anchor="middle">Docker Build</text>
  <text x="905" y="148" font-size="9" fill="#e1f5fe" text-anchor="middle">./app</text>

  <rect x="1020" y="105" width="150" height="65" rx="8" fill="#673ab7"/>
  <text x="1095" y="132" font-size="11" fill="#fff" text-anchor="middle">Trivy</text>
  <text x="1095" y="148" font-size="9" fill="#ede7f6" text-anchor="middle">CRITICAL severity</text>

  <rect x="1210" y="105" width="170" height="65" rx="8" fill="#4285f4"/>
  <text x="1295" y="132" font-size="11" fill="#fff" text-anchor="middle">Artifact Registry</text>
  <text x="1295" y="148" font-size="9" fill="#e8f0fe" text-anchor="middle">secure-apps</text>

  <rect x="1420" y="105" width="170" height="65" rx="8" fill="#1a73e8"/>
  <text x="1505" y="132" font-size="11" fill="#fff" text-anchor="middle">deploy job</text>
  <text x="1505" y="148" font-size="9" fill="#e8f0fe" text-anchor="middle">gcloud run deploy</text>

  <line x1="180" y1="137" x2="215" y2="137" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="137" x2="445" y2="137" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="427" y="122" font-size="8" fill="#4285f4" text-anchor="middle">keyless</text>
  <line x1="600" y1="137" x2="635" y2="137" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="137" x2="825" y2="137" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="137" x2="1015" y2="137" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1170" y1="137" x2="1205" y2="137" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1380" y1="137" x2="1415" y2="137" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="220" y="197" font-size="10" fill="#80868b">Branch protection: PR required + "security-scan" status check must pass before merge to main</text>

  <!-- ===================== ZONE 2: APPLICATION (CLOUD RUN) ===================== -->
  <rect x="20" y="235" width="1860" height="215" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="257" font-size="14" font-weight="bold" fill="#5f6368">Application track (serverless)</text>

  <line x1="1505" y1="170" x2="1505" y2="290" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1350" y="290" width="240" height="100" rx="8" fill="#1a73e8"/>
  <text x="1470" y="315" font-size="13" fill="#fff" text-anchor="middle">Cloud Run</text>
  <text x="1470" y="332" font-size="11" fill="#e8f0fe" text-anchor="middle">secure-dashboard</text>
  <text x="1470" y="349" font-size="9" fill="#e8f0fe" text-anchor="middle">port 8080</text>
  <text x="1470" y="365" font-size="10" fill="#c8ddfc" text-anchor="middle">min-instances=0, max=5</text>
  <text x="1470" y="380" font-size="9" fill="#c8ddfc" text-anchor="middle">public: run.invoker = allUsers</text>

  <rect x="640" y="270" width="420" height="140" rx="8" fill="#ffffff" stroke="#5f6368" stroke-dasharray="4,3"/>
  <text x="850" y="290" font-size="11" font-weight="bold" fill="#5f6368" text-anchor="middle">identity: cloud-run-sa — IAM roles bound</text>
  <text x="660" y="312" font-size="10" fill="#3c4043">- roles/datastore.user (Firestore, not owner)</text>
  <text x="660" y="331" font-size="10" fill="#3c4043">- secretAccessor on app-config only (not project-wide)</text>
  <text x="660" y="350" font-size="10" fill="#3c4043">- run.admin, artifactregistry.writer (CI/CD deploy)</text>
  <text x="660" y="369" font-size="10" fill="#3c4043">- iam.serviceAccountUser, self only (not project-wide)</text>
  <text x="660" y="392" font-size="10" fill="#c62828">never the default compute service account</text>

  <line x1="1350" y1="330" x2="1065" y2="340" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <rect x="60" y="270" width="200" height="60" rx="8" fill="#fbbc04"/>
  <text x="160" y="292" font-size="12" fill="#202124" text-anchor="middle">Firestore</text>
  <text x="160" y="308" font-size="9" fill="#202124" text-anchor="middle">security_events collection</text>
  <text x="160" y="345" font-size="10" fill="#b06000" text-anchor="middle">roles/datastore.user only</text>

  <rect x="60" y="360" width="200" height="60" rx="8" fill="#34a853"/>
  <text x="160" y="382" font-size="12" fill="#fff" text-anchor="middle">Secret Manager</text>
  <text x="160" y="398" font-size="9" fill="#e6f4ea" text-anchor="middle">app-config secret</text>
  <text x="160" y="435" font-size="10" fill="#0d652d" text-anchor="middle">secretAccessor on this secret only</text>

  <line x1="1350" y1="340" x2="260" y2="300" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1350" y1="360" x2="260" y2="390" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== ZONE 3: PUBLIC WEB INFRASTRUCTURE ===================== -->
  <rect x="20" y="470" width="1860" height="500" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="492" font-size="14" font-weight="bold" fill="#5f6368">Public web infrastructure track (VM + Load Balancer)</text>

  <rect x="40" y="515" width="130" height="55" rx="8" fill="#9aa0a6"/>
  <text x="105" y="547" font-size="11" fill="#fff" text-anchor="middle">Internet / users</text>

  <rect x="210" y="515" width="180" height="55" rx="8" fill="#ea4335"/>
  <text x="300" y="540" font-size="12" fill="#fff" text-anchor="middle">Cloud Armor WAF</text>
  <text x="300" y="555" font-size="8" fill="#fdd" text-anchor="middle">cloudock-armor-policy</text>
  <text x="300" y="590" font-size="9" fill="#a50e0e" text-anchor="middle">OWASP Top 10 WAF rules</text>
  <text x="300" y="603" font-size="8" fill="#a50e0e" text-anchor="middle">+ Log4Shell (CVE-2021-44228)</text>

  <rect x="430" y="515" width="170" height="55" rx="8" fill="#4285f4"/>
  <text x="515" y="538" font-size="10" fill="#fff" text-anchor="middle">Forwarding Rule</text>
  <text x="515" y="552" font-size="9" fill="#e8f0fe" text-anchor="middle">cloudock-http-rule</text>
  <text x="515" y="565" font-size="8" fill="#e8f0fe" text-anchor="middle">34.110.243.47 : 80</text>

  <rect x="640" y="515" width="170" height="55" rx="8" fill="#4285f4"/>
  <text x="725" y="538" font-size="10" fill="#fff" text-anchor="middle">Target HTTP Proxy</text>
  <text x="725" y="553" font-size="9" fill="#e8f0fe" text-anchor="middle">cloudock-http-proxy</text>

  <rect x="850" y="515" width="150" height="55" rx="8" fill="#4285f4"/>
  <text x="925" y="538" font-size="10" fill="#fff" text-anchor="middle">URL Map</text>
  <text x="925" y="553" font-size="9" fill="#e8f0fe" text-anchor="middle">cloudock-web-map</text>

  <rect x="1040" y="515" width="190" height="55" rx="8" fill="#4285f4"/>
  <text x="1135" y="536" font-size="10" fill="#fff" text-anchor="middle">Backend Service</text>
  <text x="1135" y="550" font-size="9" fill="#e8f0fe" text-anchor="middle">cloudock-web-backend</text>
  <text x="1135" y="563" font-size="8" fill="#e8f0fe" text-anchor="middle">security policy attached</text>

  <rect x="1040" y="600" width="190" height="45" rx="8" fill="#5c9bd6"/>
  <text x="1135" y="620" font-size="10" fill="#fff" text-anchor="middle">Health Check</text>
  <text x="1135" y="634" font-size="8" fill="#e8f0fe" text-anchor="middle">cloudock-http-health-check — / : 80</text>

  <rect x="1040" y="675" width="190" height="45" rx="8" fill="#5c9bd6"/>
  <text x="1135" y="695" font-size="10" fill="#fff" text-anchor="middle">Instance Group</text>
  <text x="1135" y="709" font-size="8" fill="#e8f0fe" text-anchor="middle">cloudock-web-ig (unmanaged)</text>

  <line x1="170" y1="542" x2="205" y2="542" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="542" x2="425" y2="542" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="542" x2="635" y2="542" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="542" x2="845" y2="542" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="542" x2="1035" y2="542" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1135" y1="570" x2="1135" y2="595" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1135" y1="645" x2="1135" y2="670" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="750" width="1780" height="200" rx="10" fill="none" stroke="#1a73e8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="770" font-size="13" font-weight="bold" fill="#1a73e8">Custom VPC — cloudock-vpc (auto_create_subnetworks = false)</text>

  <rect x="80" y="785" width="330" height="150" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="245" y="802" font-size="11" font-weight="bold" fill="#1a73e8" text-anchor="middle">public subnet — 10.0.1.0/24</text>

  <rect x="100" y="815" width="290" height="55" rx="8" fill="#4285f4"/>
  <text x="245" y="836" font-size="10" fill="#fff" text-anchor="middle">e2-micro VM — cloudock-webserver</text>
  <text x="245" y="850" font-size="8" fill="#e8f0fe" text-anchor="middle">Shielded VM · identity: web-sa</text>
  <text x="245" y="886" font-size="9" fill="#1a73e8" text-anchor="middle">SSH key only · no public IP</text>

  <rect x="100" y="900" width="140" height="30" rx="6" fill="#5f9ea0"/>
  <text x="170" y="920" font-size="9" fill="#fff" text-anchor="middle">NAT Router</text>
  <rect x="250" y="900" width="140" height="30" rx="6" fill="#5f9ea0"/>
  <text x="320" y="920" font-size="9" fill="#fff" text-anchor="middle">NAT Gateway</text>
  <line x1="1135" y1="720" x2="245" y2="815" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="785" width="330" height="150" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="595" y="802" font-size="11" font-weight="bold" fill="#5f6368" text-anchor="middle">private subnet — 10.0.2.0/24</text>
  <text x="595" y="870" font-size="9" fill="#80868b" text-anchor="middle">(reserved — no workloads deployed here yet)</text>

  <rect x="790" y="785" width="1030" height="150" rx="8" fill="#ffffff" stroke="#5f6368" stroke-dasharray="4,3"/>
  <text x="1305" y="803" font-size="11" font-weight="bold" fill="#5f6368" text-anchor="middle">Firewall rules — default deny, explicit allow</text>
  <text x="810" y="823" font-size="9" fill="#3c4043">cloudock-allow-ssh — tcp:22 from your IP /32 only</text>
  <text x="810" y="841" font-size="9" fill="#3c4043">cloudock-allow-iap-ssh — tcp:22 from 35.235.240.0/20 (IAP range)</text>
  <text x="810" y="859" font-size="9" fill="#3c4043">cloudock-allow-http — tcp:80 from 0.0.0.0/0 (public web tier)</text>
  <text x="1400" y="823" font-size="9" fill="#3c4043">cloudock-allow-https — tcp:443 from 0.0.0.0/0</text>
  <text x="1400" y="841" font-size="9" fill="#3c4043">cloudock-allow-lb-health-check — tcp:80 from GFE ranges only</text>
  <text x="1400" y="859" font-size="9" fill="#c62828">cloudock-deny-all-ingress — all from 0.0.0.0/0 (priority 65534, catch-all)</text>
  <text x="810" y="895" font-size="9" fill="#1a73e8">VPC Flow Logs: enabled on both subnets (5s interval, 50% sampling)</text>
  <text x="810" y="913" font-size="9" fill="#1a73e8">Private Google Access: enabled on both subnets</text>

  <!-- ===================== ZONE 4: SHARED SERVICES ===================== -->
  <rect x="20" y="970" width="1860" height="210" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="992" font-size="14" font-weight="bold" fill="#5f6368">Shared services</text>

  <rect x="60" y="1015" width="260" height="90" rx="8" fill="#34a853"/>
  <text x="190" y="1038" font-size="12" fill="#fff" text-anchor="middle">Cloud Storage</text>
  <text x="190" y="1054" font-size="9" fill="#e6f4ea" text-anchor="middle">security-assets bucket</text>
  <text x="190" y="1069" font-size="8" fill="#e6f4ea" text-anchor="middle">versioned - 90-day delete lifecycle</text>
  <text x="190" y="1082" font-size="8" fill="#e6f4ea" text-anchor="middle">uniform access + public access prevention</text>
  <text x="190" y="1097" font-size="8" fill="#e6f4ea" text-anchor="middle">identity: cloudock-storage-writer (objectCreator only)</text>

  <rect x="360" y="1015" width="320" height="90" rx="8" fill="#9aa0a6"/>
  <text x="520" y="1038" font-size="12" fill="#fff" text-anchor="middle">Cloud Monitoring</text>
  <text x="520" y="1056" font-size="9" fill="#f1f3f4" text-anchor="middle">cloudock-uptime-check to Cloud Run /health</text>
  <text x="520" y="1071" font-size="8" fill="#f1f3f4" text-anchor="middle">every 300s from USA / EUROPE / ASIA_PACIFIC</text>
  <text x="520" y="1088" font-size="8" fill="#f1f3f4" text-anchor="middle">cloudock-error-rate-alert to email channel (5xx rate)</text>

  <rect x="720" y="1015" width="260" height="90" rx="8" fill="#5f6368"/>
  <text x="850" y="1040" font-size="12" fill="#fff" text-anchor="middle">Security Command Center</text>
  <text x="850" y="1058" font-size="9" fill="#dadce0" text-anchor="middle">Standard tier (free, project-level)</text>
  <text x="850" y="1075" font-size="9" fill="#dadce0" text-anchor="middle">Security Health Analytics findings</text>
  <text x="850" y="1092" font-size="8" fill="#dadce0" text-anchor="middle">logged in SECURITY_HARDENING.md</text>

  <line x1="520" y1="1015" x2="1470" y2="392" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowDash)"/>
  <line x1="500" y1="1015" x2="1135" y2="571" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowDash)"/>

  <text x="40" y="1200" font-size="10" fill="#80868b">Dashed blue VPC border = network boundary.  Dashed gray box = identity/IAM detail panel.  Dashed gray arrows = monitoring, not a request path.</text>
  <text x="40" y="1218" font-size="10" fill="#80868b">Two independent serving paths by design: Cloud Run (serverless dashboard app) and the VM + Load Balancer track (public web tier) do not share traffic.</text>
</svg>
